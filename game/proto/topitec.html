var AC=null, motor=null, luft=null;
function tonAn(){
  if(AC){ try{ if(AC.state==='suspended') AC.resume(); }catch(e){} return; }
  try{ var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); }catch(e){ AC=null; }

function piep(f,ms){
  if(!AC) return;
  try{ var o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f||880;
    g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.18,AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(ms||160)/1000);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(ms||160)/1000+0.05); }catch(e){}
}
function motorAn(){
  if(!AC||motor) return;
  try{
    var o=AC.createOscillator(), o2=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
    o.type='sawtooth'; o2.type='square'; f.type='lowpass'; f.frequency.value=900; g.gain.value=0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination); o.start(); o2.start();
    motor={o:o,o2:o2,g:g};
  }catch(e){ motor=null; }
}
function motorDreh(rpm){
  if(!motor) return;
  /* Tonhoehe folgt der Drehzahl: 2000 klingt hoeher als 1000 */
  var hz=60+rpm*0.07;
  try{ motor.o.frequency.setTargetAtTime(hz,AC.currentTime,0.15); motor.o2.frequency.setTargetAtTime(hz*0.5,AC.currentTime,0.15);
       motor.g.gain.setTargetAtTime(rpm?0.05:0,AC.currentTime,0.12); }catch(e){}
}
function luftAn(){
  if(!AC||luft) return;
  try{
    var len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var s=AC.createBufferSource(); s.buffer=buf; s.loop=true;
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=0.7;
    var g=AC.createGain(); g.gain.value=0; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
    luft={s:s,g:g};
  }catch(e){ luft=null; }
}

function stopTon(){
  if(motor){ try{ motor.o.stop(); motor.o2.stop(); }catch(e){} motor=null; }
  if(luft){ try{ luft.s.stop(); }catch(e){} luft=null; }
}
